name: Auto Build & Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "current=$TAG" >> $GITHUB_OUTPUT

      - name: Auto bump version (Patch)
        id: bump
        run: |
          OLD=${{ steps.tag.outputs.current }}
          OLD=${OLD#v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD"
          PATCH=$((PATCH + 1))

          NEW="v$MAJOR.$MINOR.$PATCH"

          echo "new=$NEW" >> $GITHUB_OUTPUT

      - name: Show Version
        run: |
          echo "Current Version: ${{ steps.tag.outputs.current }}"
          echo "New Version: ${{ steps.bump.outputs.new }}"

      - name: Create ZIP
        run: |
          zip -r MTK-Camera2API-Pro.zip . \
          -x ".git/*" \
          -x ".github/*"

      - name: Create Git Tag
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag ${{ steps.bump.outputs.new }}
          git push origin ${{ steps.bump.outputs.new }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new }}
          name: Release ${{ steps.bump.outputs.new }}
          files: MTK-Camera2API-Pro.zip
