name: Auto Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest tag
        id: tag
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          echo "current=$TAG" >> $GITHUB_OUTPUT

      - name: Auto bump patch version
        id: bump
        run: |
          OLD=${{ steps.tag.outputs.current }}
          OLD=${OLD#v}

          IFS='.' read -r MAJOR MINOR PATCH <<< "$OLD"
          PATCH=$((PATCH + 1))

          NEW="v$MAJOR.$MINOR.$PATCH"
          echo "new=$NEW" >> $GITHUB_OUTPUT

      - name: Show version info
        run: |
          echo "Current Version: ${{ steps.tag.outputs.current }}"
          echo "New Version: ${{ steps.bump.outputs.new }}"

      - name: Build module ZIP
        run: |
          zip -r Camera2API-MTK.zip . \
          -x ".git/*" \
          -x ".github/*"

      # Push Git Tag using GITHUB_TOKEN
      - name: Create and push Git tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git tag ${{ steps.bump.outputs.new }}
          git push origin ${{ steps.bump.outputs.new }}

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.new }}
          name: Release ${{ steps.bump.outputs.new }}
          files: Camera2API-MTK.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
