name: Camera2API Auto Build & Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Module Version
        id: setver
        run: |
          DATE=$(date +"%Y.%m.%d.%H%M")
          echo "version=$DATE" >> $GITHUB_OUTPUT
          sed -i "s/version: .*/version: $DATE/" module.prop
          echo "Generated version: $DATE"

      - name: Build Module ZIP
        run: |
          zip -r Camera2API-MTK.zip . \
          -x ".git/*" \
          -x ".github/*"

      - name: List Build Output
        run: ls -lah Camera2API-MTK.zip

      - name: Create Git Tag
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          TAG="v${{ steps.setver.outputs.version }}"
          git tag $TAG
          git push origin $TAG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.setver.outputs.version }}
          name: "Camera2API v${{ steps.setver.outputs.version }}"
          draft: false
          prerelease: false
          files: Camera2API-MTK.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
