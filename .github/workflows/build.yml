name: Camera2API Auto Build & Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    
    # PERMISSION PENTING
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Module Version
        id: setver
        run: |
          # Format: YYYY.MMDD.HHMM
          DATE=$(date +"%Y.%m%d.%H%M")
          echo "version=$DATE" >> $GITHUB_OUTPUT
          
          # Update module.prop dengan version baru
          sed -i "s/^version=.*/version=v$DATE/" module.prop
          sed -i "s/^versionCode=.*/versionCode=$(date +%Y%m%d%H%M)/" module.prop
          
          echo "Generated version: $DATE"
          echo "=== module.prop content ==="
          cat module.prop

      - name: Create Module Structure
        run: |
          # HANYA buat folder META-INF
          mkdir -p META-INF/com/google/android
          
          echo "=== Preparing module structure ==="
          echo "Current directory: $(pwd)"
          echo "Files in directory:"
          ls -la
          
          # HAPUS baris cp -v module.prop ./ dst...
          # File-file sudah ada di tempatnya
          
          # Buat updater-script untuk Magisk
          cat > META-INF/com/google/android/updater-script << 'EOF'
          #MAGISK
          EOF
          
          # Buat update-binary
          cat > META-INF/com/google/android/update-binary << 'EOF'
          #!/sbin/sh
          
          #################
          # Initialization
          #################
          
          umask 022
          
          echo "*******************************"
          echo " Camera2API HAL3 - Universal MTK"
          echo "*******************************"
          
          api=$(getprop ro.build.version.sdk)
          
          #########################
          # Installation
          #########################
          
          ui_print "- Mounting system"
          mount -o rw,remount /system 2>/dev/null
          
          ui_print "- Installing module files"
          
          # Clean up old module if exists
          OLD_PATH=/data/adb/modules/Camera2API-MTK
          if [ -d "$OLD_PATH" ]; then
            rm -rf "$OLD_PATH"
          fi
          
          # Extract module files
          unzip -o "$ZIPFILE" 'module.prop' -d $MODPATH >&2
          unzip -o "$ZIPFILE" 'system.prop' -d $MODPATH >&2
          unzip -o "$ZIPFILE" 'post-fs-data.sh' -d $MODPATH >&2
          unzip -o "$ZIPFILE" 'service.sh' -d $MODPATH >&2
          unzip -o "$ZIPFILE" 'permission_trigger.sh' -d $MODPATH >&2
          # README.md dan LICENSE tidak perlu di-extract ke device
          
          # Set permissions
          set_perm_recursive $MODPATH 0 0 0755 0644
          set_perm $MODPATH/post-fs-data.sh 0 0 0755
          set_perm $MODPATH/service.sh 0 0 0755
          set_perm $MODPATH/permission_trigger.sh 0 0 0755
          
          ui_print "- Installation complete!"
          ui_print " "
          ui_print "*******************************"
          ui_print " Reboot untuk menerapkan perubahan"
          ui_print "*******************************"
          EOF
          
          # Set permissions untuk executable files
          chmod +x META-INF/com/google/android/update-binary
          chmod +x post-fs-data.sh
          chmod +x service.sh
          chmod +x permission_trigger.sh
          
          # List files untuk verifikasi
          echo "=== Final file structure ==="
          find . -type f | sort

      - name: Build Module ZIP
        run: |
          # Nama file dengan versi
          VERSION="${{ steps.setver.outputs.version }}"
          ZIP_NAME="Camera2API-MTK-v${VERSION}.zip"
          
          echo "=== Creating ZIP: ${ZIP_NAME} ==="
          echo "Files to be included:"
          find . -type f ! -path "./.git/*" ! -path "./.github/*" | sort
          
          # Buat ZIP dengan kompresi level 9
          # Termasuk SEMUA file di current directory
          zip -r9 "${ZIP_NAME}" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "*.tmp" \
            -x "*.log" \
            -x "${ZIP_NAME}"  # Hindari include diri sendiri
          
          echo "=== ZIP created successfully ==="
          echo "ZIP file: ${ZIP_NAME}"
          echo "File size:"
          ls -lh "${ZIP_NAME}"
          
          # Tampilkan isi ZIP untuk verifikasi
          echo "=== Contents of ZIP (first 30 files) ==="
          unzip -l "${ZIP_NAME}" | head -35

      - name: Upload Module as Artifact (Optional)
        uses: actions/upload-artifact@v4
        with:
          name: camera2api-module
          path: Camera2API-MTK-*.zip
          retention-days: 7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.setver.outputs.version }}
          name: "Camera2API v${{ steps.setver.outputs.version }}"
          body: |
            ## Camera2API HAL3 - Universal MTK
            
            ###  Release Info
            - **Version**: ${{ steps.setver.outputs.version }}
            - **Build Date**: $(date +'%Y-%m-%d %H:%M:%S')
            - **Module ID**: camera2api_mtk
            
            ###  Included Files
            - `module.prop` - Module properties
            - `system.prop` - System properties
            - `post-fs-data.sh` - Post-fs-data script
            - `service.sh` - Service script  
            - `permission_trigger.sh` - Permission script
            - `README.md` - Documentation
            - `LICENSE` - Apache 2.0 License
            
            ###  Installation
            1. Download the ZIP file below
            2. Open Magisk Manager
            3. Go to Modules → Install from storage
            4. Select the downloaded ZIP
            5. Reboot your device
            
            ###  Features
            - Enables Camera2API on MTK devices
            - Enables HAL3 camera support
            - Universal MediaTek compatibility
            - Auto permission handling
            
            ###  Notes
            - Make sure you have Magisk installed
            - Backup your data before installation
            - Report issues in the repository
            
            ---
            
            *Auto-generated release from GitHub Actions*
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            Camera2API-MTK-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}